services:
  - type: web
    name: listenalong
    runtime: python
    plan: starter
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    disk:
      name: listenalong-data
      mountPath: /data
      sizeGB: 10
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: DATA_DIR
        value: /data
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: APP_PASSWORD
        sync: false
      - key: APP_SECRET
        sync: false
