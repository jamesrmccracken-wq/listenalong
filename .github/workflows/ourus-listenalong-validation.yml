name: ListenAlong offline Python validation
on:
  push:
    branches:
      - 'ourus/listenalong-ci-baseline-*'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Compile application
        run: python -m compileall -q .
      - name: Validate offline import and auth contract
        run: python -m unittest discover -s tests -p 'test_ourus_*.py' -v
