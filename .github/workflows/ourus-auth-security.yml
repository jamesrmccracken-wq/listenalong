name: ListenAlong authentication security
on:
  push:
    branches:
      - 'ourus/listenalong-auth-hardening-*'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  auth-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python -m compileall -q auth.py tests/test_ourus_auth.py
      - run: python -m unittest discover -s tests -p 'test_ourus_auth.py' -v
